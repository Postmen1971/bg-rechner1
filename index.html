<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Sternenheft – Lern- und Hausaufgaben-App für Klasse 2 bis 4">
<meta name="theme-color" content="#F3F7FB">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23FFB400' d='M12 2.4l2.95 6.1 6.65.85-4.9 4.6 1.3 6.6L12 17.3l-6 3.25 1.3-6.6-4.9-4.6 6.65-.85z'/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Sternenheft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;700;800&display=swap">
<style>
:root{
  --paper:#F3F7FB; --grid:#DCE8F3; --card:#FFFFFF; --ink:#1D2A44; --muted:#5A6A86; --line:#D8E2EE;
  --accent:#FF6A3D; --accent-ink:#FFFFFF; --star:#FFB400; --star-soft:#FFF1C7;
  --ok:#159A62; --ok-soft:#DDF5EA; --warn:#C77700; --warn-soft:#FFF0D6; --bad:#D6405A;
  --c-ma:#2F6FD6; --c-de:#D23F79; --c-sa:#2E9B4F; --c-en:#0B98AE; --c-er:#B8690F;
  --shadow:0 2px 0 rgba(29,42,68,.10);
  --display:"Baloo 2", "Comic Sans MS", system-ui, sans-serif;
  --body:"Andika", "Trebuchet MS", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#131A28; --grid:#1B2436; --card:#1C2638; --ink:#ECF1F8; --muted:#9FAEC6; --line:#2C3A54;
    --accent:#FF7C55; --accent-ink:#1A0E08; --star:#FFC53D; --star-soft:#3A3217;
    --ok:#3CCB8A; --ok-soft:#153526; --warn:#FFB64D; --warn-soft:#3A2C12; --bad:#FF6B84;
    --c-ma:#6EA2FF; --c-de:#FF6FA6; --c-sa:#5ACB78; --c-en:#35C6DC; --c-er:#F2A541;
    --shadow:0 2px 0 rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#131A28; --grid:#1B2436; --card:#1C2638; --ink:#ECF1F8; --muted:#9FAEC6; --line:#2C3A54;
  --accent:#FF7C55; --accent-ink:#1A0E08; --star:#FFC53D; --star-soft:#3A3217;
  --ok:#3CCB8A; --ok-soft:#153526; --warn:#FFB64D; --warn-soft:#3A2C12; --bad:#FF6B84;
  --c-ma:#6EA2FF; --c-de:#FF6FA6; --c-sa:#5ACB78; --c-en:#35C6DC; --c-er:#F2A541;
  --shadow:0 2px 0 rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0; background-color:var(--paper); color:var(--ink); font-family:var(--body); font-size:18px; line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  -webkit-tap-highlight-color:transparent;
}
#app{max-width:680px; margin:0 auto; padding-inline:16px; padding-block:12px 40px; display:flex; flex-direction:column; gap:18px}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
h1,h2,h3{font-family:var(--display); margin:0; line-height:1.15; text-wrap:balance}

/* top bar */
.bar{display:flex; align-items:center; gap:10px; min-height:52px}
.bar .title{flex:1; min-width:0}
.bar h1{font-size:30px; font-weight:800; letter-spacing:.2px}
.bar h1 .dot{color:var(--star)}
.bar .sub{font-size:14px; color:var(--muted)}
.back{width:48px; height:48px; border-radius:14px; background:var(--card); border:2px solid var(--line); display:grid; place-items:center; flex:none}
.back svg{width:22px; height:22px}
.pill{display:inline-flex; align-items:center; gap:6px; background:var(--star-soft); color:var(--ink); border-radius:999px; padding:6px 14px 6px 10px; font-family:var(--display); font-weight:800; font-size:20px; flex:none; font-variant-numeric:tabular-nums}
.pill svg{width:24px; height:24px; color:var(--star)}
.pill.pop{animation:pop .5s ease}
@keyframes pop{40%{transform:scale(1.25)}}

.label{font-family:var(--display); font-weight:700; font-size:15px; letter-spacing:.8px; text-transform:uppercase; color:var(--muted)}
section{display:flex; flex-direction:column; gap:10px}

/* profiles */
.profiles{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
.prof{background:var(--card); border:3px solid var(--line); border-radius:20px; padding:14px; display:flex; flex-direction:column; gap:6px; text-align:left; box-shadow:var(--shadow)}
.prof.on{border-color:var(--accent)}
.prof .nm{font-family:var(--display); font-weight:800; font-size:24px; overflow-wrap:anywhere}
.prof .st{display:flex; align-items:center; gap:6px; color:var(--muted); font-size:16px}
.prof .st svg{width:20px; height:20px; color:var(--star)}
.linkbtn{font-size:15px; color:var(--muted); text-decoration:underline; padding:4px 0; align-self:flex-start}
.editrow{display:flex; gap:8px; flex-wrap:wrap}
.editrow input{flex:1; min-width:0; font:inherit; font-size:18px; padding:10px 12px; border-radius:12px; border:2px solid var(--line); background:var(--paper); color:var(--ink)}

/* subjects */
.subjects{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
.subj{--c:var(--c-ma); background:var(--card); border-radius:22px; padding:16px; display:flex; flex-direction:column; gap:8px; text-align:left; border:3px solid var(--line); border-bottom:6px solid var(--c); min-height:150px}
.subj .gl{width:64px; height:64px; border-radius:18px; background:var(--c); color:#fff; display:grid; place-items:center; font-family:var(--display); font-weight:800; font-size:26px; letter-spacing:-.5px}
.subj .nm{font-family:var(--display); font-weight:800; font-size:clamp(17px,4.6vw,24px); hyphens:auto; -webkit-hyphens:auto}
.subj .ds{font-size:15px; color:var(--muted); line-height:1.35}

/* grade tabs */
.grades{display:grid; grid-template-columns:repeat(auto-fit,minmax(0,1fr)); gap:8px}
.grade{background:var(--card); border:3px solid var(--line); border-radius:16px; padding:10px 6px; display:flex; flex-direction:column; align-items:center; gap:0}
.grade b{font-family:var(--display); font-size:22px; font-weight:800}
.grade span{font-size:13px; color:var(--muted)}
.grade.on{border-color:var(--c); background:var(--c); color:#fff}
.grade.on span{color:rgba(255,255,255,.9)}

.topics{display:flex; flex-direction:column; gap:10px}
.topic{background:var(--card); border:2px solid var(--line); border-radius:18px; padding:14px 16px; display:flex; align-items:center; gap:14px; text-align:left; box-shadow:var(--shadow)}
.topic .tx{flex:1; min-width:0}
.topic .nm{font-family:var(--display); font-weight:700; font-size:21px; line-height:1.2}
.topic .ds{font-size:15px; color:var(--muted)}
.topic .best{display:flex; align-items:center; gap:4px; font-family:var(--display); font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums; flex:none}
.topic .best svg{width:22px; height:22px; color:var(--star)}
.topic .best.none svg{color:var(--line)}
.topic .go{width:40px; height:40px; border-radius:12px; background:var(--c); color:#fff; display:grid; place-items:center; flex:none}
.topic .go svg{width:20px; height:20px}

/* quiz */
.prog{display:grid; grid-template-columns:repeat(8,1fr); gap:6px}
.prog i{height:10px; border-radius:6px; background:var(--line)}
.prog i.ok{background:var(--ok)} .prog i.no{background:var(--bad)} .prog i.cur{background:var(--c)}
.qcard{background:var(--card); border:2px solid var(--line); border-radius:24px; padding:20px; display:flex; flex-direction:column; gap:14px; box-shadow:var(--shadow)}
.qhead{display:flex; align-items:center; justify-content:space-between; gap:8px}
.qnum{font-size:15px; color:var(--muted)}
.speak{display:inline-flex; align-items:center; gap:6px; padding:8px 12px; border-radius:12px; background:var(--paper); border:2px solid var(--line); font-size:15px}
.speak svg{width:20px; height:20px}
.qtext{font-family:var(--display); font-weight:700; font-size:clamp(26px,6.5vw,38px); line-height:1.25; text-wrap:balance}
.qtext.long{font-family:var(--body); font-weight:700; font-size:clamp(20px,4.8vw,25px); line-height:1.4}
.qtext .gap{display:inline-block; min-width:2.2em; border-bottom:4px solid var(--c); text-align:center; color:var(--c)}

.col{overflow-x:auto}
.col table{border-collapse:collapse; font-family:var(--display); font-weight:700; font-size:34px; font-variant-numeric:tabular-nums; margin:0 auto}
.col td{width:1.05em; height:1.35em; text-align:center; padding:0; background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px); background-size:100% 100%}
.col tr.carry td{font-size:18px; height:1.2em; color:var(--accent)}
.col tr.res td{border-top:3px solid var(--ink)}
.col tr.res.done td{color:var(--ok)}
.col .box{display:inline-block; width:.7em; height:.9em; border:2px dashed var(--muted); border-radius:6px; vertical-align:middle}
.steps .col table{font-size:26px}

.answer{display:flex; flex-direction:column; gap:12px}
.display{display:flex; align-items:center; justify-content:center; min-height:72px; border-radius:18px; border:3px solid var(--c); background:var(--paper); font-family:var(--display); font-weight:800; font-size:40px; font-variant-numeric:tabular-nums; letter-spacing:1px}
.display.empty{color:var(--muted)}
.display .unit{font-size:24px; color:var(--muted); margin-left:8px}
.pad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.key{height:64px; border-radius:16px; background:var(--card); border:2px solid var(--line); border-bottom-width:5px; font-family:var(--display); font-weight:800; font-size:30px}
.key:active{transform:translateY(2px); border-bottom-width:3px}
.key.del svg{width:28px; height:28px}
.key.check{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-size:22px}
.opts{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.opts.single{grid-template-columns:1fr}
.opt{min-height:64px; border-radius:16px; background:var(--card); border:2px solid var(--line); border-bottom-width:5px; font-family:var(--display); font-weight:700; font-size:22px; padding:10px 12px; line-height:1.2}
.opt:active{transform:translateY(2px)}
.opt.wrong{border-color:var(--bad); color:var(--bad); opacity:.6; text-decoration:line-through}
.opt.right{border-color:var(--ok); background:var(--ok-soft)}
.opt:disabled{cursor:default}
.hintbtn{align-self:flex-start; display:inline-flex; align-items:center; gap:8px; padding:10px 16px; border-radius:14px; background:var(--star-soft); font-weight:700; font-size:17px}
.hintbtn svg{width:20px; height:20px}

.fb{border-radius:22px; padding:18px; display:flex; flex-direction:column; gap:12px; border:2px solid}
.fb.ok{background:var(--ok-soft); border-color:var(--ok)}
.fb.warn{background:var(--warn-soft); border-color:var(--warn)}
.fb.explain{background:var(--card); border-color:var(--c)}
.fb h3{font-size:26px; font-weight:800; display:flex; align-items:center; gap:10px}
.fb.ok h3{color:var(--ok)} .fb.warn h3{color:var(--warn)} .fb.explain h3{color:var(--c)}
.fb h3 svg{width:32px; height:32px; color:var(--star); flex:none}
.fb h3 .burst{animation:burst .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes burst{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
.fb p{margin:0}
.steps{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; counter-reset:s}
.steps li{counter-increment:s; display:grid; grid-template-columns:36px 1fr; gap:10px; align-items:start; animation:slide .35s ease}
.steps li::before{content:counter(s); width:36px; height:36px; border-radius:50%; background:var(--c); color:#fff; display:grid; place-items:center; font-family:var(--display); font-weight:800; font-size:19px}
.steps li > div{padding-top:3px; min-width:0}
.steps b{color:var(--c)}
@keyframes slide{from{opacity:.2; transform:translateY(6px)}to{opacity:1; transform:none}}
.sol{font-family:var(--display); font-weight:800; font-size:24px}
.row{display:flex; gap:10px; flex-wrap:wrap}
.btn{min-height:56px; padding:10px 22px; border-radius:16px; font-family:var(--display); font-weight:800; font-size:21px; background:var(--accent); color:var(--accent-ink); border-bottom:4px solid rgba(0,0,0,.18); flex:1}
.btn.ghost{background:var(--card); color:var(--ink); border:2px solid var(--line); border-bottom-width:4px}
.hint{background:var(--star-soft); border-radius:16px; padding:12px 14px; font-size:17px}

/* result */
.result{background:var(--card); border:2px solid var(--line); border-radius:26px; padding:26px 20px; display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center; box-shadow:var(--shadow)}
.result h2{font-size:38px; font-weight:800}
.bigstars{display:flex; flex-wrap:wrap; justify-content:center; gap:4px}
.bigstars svg{width:40px; height:40px; color:var(--line)}
.bigstars svg.on{color:var(--star); animation:burst .6s cubic-bezier(.2,1.6,.4,1) both}
.result .score{font-family:var(--display); font-weight:800; font-size:24px; font-variant-numeric:tabular-nums}
.result p{margin:0; color:var(--muted); max-width:34ch}
.note{font-size:14px; color:var(--muted); text-align:center}

.subj:last-child:nth-child(odd){grid-column:1/-1; min-height:0; display:grid; grid-template-columns:auto 1fr; column-gap:14px; align-items:center}
.subj:last-child:nth-child(odd) .gl{grid-row:span 2}
.fig{display:flex; justify-content:center}
.fig svg{width:min(250px,72vw); height:auto; overflow:visible}
.fig .face{fill:var(--card); stroke:var(--ink); stroke-width:5}
.fig .tick{stroke:var(--muted); stroke-width:2} .fig .tick.big{stroke:var(--ink); stroke-width:4}
.fig .num{fill:var(--ink); font-family:var(--display); font-weight:700; font-size:20px; text-anchor:middle; dominant-baseline:central}
.fig .hh{stroke:var(--ink); stroke-width:9; stroke-linecap:round} .fig .mh{stroke:var(--c); stroke-width:5; stroke-linecap:round}
.fig .hub{fill:var(--ink)}
.fig .shape{fill:var(--c); fill-opacity:.18; stroke:var(--c); stroke-width:4; stroke-linejoin:round}
.fig .gl{stroke:var(--c); stroke-opacity:.35; stroke-width:1.5}
.fig .lab{fill:var(--ink); font-family:var(--display); font-weight:700; font-size:18px; text-anchor:middle; dominant-baseline:central}
.opt.letter{font-size:44px; min-height:84px}
.dinput{width:100%; font-family:var(--body); font-weight:700; font-size:28px; padding:14px 16px; border-radius:18px; border:3px solid var(--c); background:var(--paper); color:var(--ink)}
.dinput:disabled{opacity:.75}
.picbox{display:flex; justify-content:center; padding-block:4px}
.pic{font-size:96px; line-height:1.1; font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.pic.sm{font-size:28px; vertical-align:middle}
.swatch{display:inline-block; width:120px; height:120px; border-radius:26px; border:3px solid var(--line); box-shadow:inset 0 -6px 0 rgba(0,0,0,.12)}
.swatch.sm{width:26px; height:26px; border-radius:7px; border-width:2px; vertical-align:middle; box-shadow:none}
.dots{display:grid; grid-template-columns:repeat(5,30px); gap:12px; justify-content:center}
.dots i{width:30px; height:30px; border-radius:50%; background:var(--c)}
.voices{background:var(--card); border:2px solid var(--line); border-radius:18px; padding:12px 14px; display:flex; flex-direction:column; gap:10px}
.vrow{display:grid; grid-template-columns:80px 1fr auto; gap:8px; align-items:center}
.vrow label{font-weight:700}
.vrow select{min-width:0; width:100%; font:inherit; font-size:16px; padding:8px 10px; border-radius:12px; border:2px solid var(--line); background:var(--paper); color:var(--ink)}
@media (max-width:420px){.vrow{grid-template-columns:1fr auto}.vrow label{grid-column:1/-1}}
.dinput.num{font-family:var(--display); font-size:32px; text-align:center; font-variant-numeric:tabular-nums; min-width:0}
.helprow{display:grid; grid-template-columns:1fr; gap:10px}
.ops{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.op{height:56px; border-radius:14px; background:var(--paper); border:2px solid var(--line); font-family:var(--display); font-weight:800; font-size:30px}
.op.on{background:var(--c); border-color:var(--c); color:#fff}
.helper-card{display:flex; align-items:center; gap:14px; text-align:left; background:var(--card); border:3px solid var(--c-ma); border-radius:22px; padding:16px; box-shadow:var(--shadow)}
.helper-card .gl{width:56px; height:56px; flex:none; border-radius:50%; background:var(--star); color:#1D2A44; display:grid; place-items:center; font-family:var(--display); font-weight:800; font-size:32px}
.helper-card .nm{display:block; font-family:var(--display); font-weight:800; font-size:23px}
.helper-card .ds{display:block; font-size:15px; color:var(--muted); line-height:1.35}
.hint .steps li::before{background:var(--star); color:#1D2A44}
.listen{display:flex; align-items:center; justify-content:center; gap:10px}
.listen svg{width:26px; height:26px}
.peek{font-family:var(--body); font-weight:700; font-size:34px; text-align:center; padding:16px; border-radius:18px; background:var(--star-soft)}
mark{background:var(--warn-soft); color:var(--bad); border-bottom:3px solid var(--bad); border-radius:3px; padding:0 1px}
@media (max-width:380px){ .subj{min-height:0} .subj .gl{width:52px;height:52px;font-size:22px} .opts{grid-template-columns:1fr} }

/* Karten & Bilder */
:root{--sea:#CFE6FA; --land:#F3EEDC; --land-far:#E4E7EB; --landline:#FFFFFF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sea:#173654; --land:#3B4B60; --land-far:#2A3444; --landline:#1C2638}}
:root[data-theme="dark"]{--sea:#173654; --land:#3B4B60; --land-far:#2A3444; --landline:#1C2638}
.map{border-radius:18px; overflow:hidden}
.map svg{width:100%; height:auto; display:block}
.map.de svg{max-height:62vh}
.map .sea{fill:var(--sea)}
.map .land{fill:var(--land); stroke:var(--landline); stroke-width:.7; stroke-linejoin:round; transition:opacity .2s}
.map .land.far{fill:var(--land-far)}
.map .k-eu{fill:#7FB2FF}.map .k-as{fill:#FFBE63}.map .k-af{fill:#F5D65A}.map .k-au{fill:#FF93B6}.map .k-an{fill:#E6ECF3}.map .k-na{fill:#74D18E}.map .k-sa{fill:#5ED0E0}
.map .dim{opacity:.28}
.map .hl{fill:var(--accent)!important; opacity:1; stroke:#fff; stroke-width:1.4}
.map .sel{fill:var(--star)!important; stroke:var(--ink); stroke-width:1.6}
.map .st{fill:var(--land); stroke:#fff; stroke-width:1.3; stroke-linejoin:round}
.map .st.c0{fill:#FFE08A}.map .st.c1{fill:#B9E4A0}.map .st.c2{fill:#FFC4A8}.map .st.c3{fill:#B8D8FF}.map .st.c4{fill:#E4C8FF}
.map .nb{fill:var(--land-far); stroke:var(--landline); stroke-width:1}
.map .riv{stroke:#4A9BE8; stroke-width:2.6; fill:none; stroke-linecap:round; opacity:.85}
.map .riv.hl{stroke:#0F5BD1; stroke-width:7; opacity:1; fill:none!important}
.map .city,.map .cap{fill:var(--ink); stroke:#fff; stroke-width:2}
.map .clab{font:700 17px var(--body); fill:var(--ink); paint-order:stroke; stroke:var(--card); stroke-width:4px}
.map .sealab{font:italic 700 17px var(--body); fill:#2A73B8; text-anchor:middle}
.map .ring{fill:none; stroke:var(--accent); stroke-width:3; stroke-dasharray:5 4}
.pin path{fill:var(--accent); stroke:#fff; stroke-width:2.5} .pin circle{fill:#fff}
.map [data-map]{cursor:pointer}
.fig .lead{stroke:var(--ink); stroke-width:2.5} .fig .leaddot{fill:var(--ink)}
.tagn circle{fill:var(--accent); stroke:#fff; stroke-width:2.5} .tagn text{fill:#fff; font:800 16px var(--display); text-anchor:middle; dominant-baseline:central}
.fig.wide svg{width:100%} .fig .arrow{stroke:#fff; stroke-width:4; fill:none; stroke-linecap:round; stroke-linejoin:round}
.fig .wire,.fig .wire path{stroke:var(--ink); stroke-width:4; fill:none; stroke-linecap:round}
.steps .map,.steps .fig{margin-top:8px}
.atlas .ainfo{display:flex; flex-direction:column; gap:6px}
.atlas .ainfo h3{font-size:28px; font-weight:800}
.atlas .ainfo p{margin:0}
.flag{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}

  else if(a===3){st.push({t:`Rechne erst 2 · ${b} = ${2*b}, dann noch eine Reihe dazu.`,why:'3 ist 2 + 1. Das Doppelte kennst du schon.',vis:dotsSVG(3,b,{split:2,labels:[[0,2,`2 · ${b} = ${2*b}`,'#4C86F0'],[2,3,`1 · ${b} = ${b}`,'#FF9433']]})});

function divKlein(a,d){const q=a/d,st=[];
  st.push({t:`${a} : ${d} bedeutet: Verteile <b>${a}</b> Punkte gerecht auf <b>${d} Gruppen</b>.`,why:'Geteilt heißt gerecht verteilen. Jede Gruppe soll gleich viele bekommen.',vis:pileSVG(a)});

  st.push({t:`Also: ${a} : ${d} = <b>${q}</b>. Jede Gruppe bekommt ${q}.`,why:`Probe: ${q} · ${d} = ${a}. In jeder Gruppe liegen gleich viele Punkte.`,vis:groupsSVG(d,q)});

function solveAdd(a,b){
  const s=a+b,L=String(s).length,w=L+1,A=[...String(a)].reverse(),B=[...String(b)].reverse(),n=Math.max(A.length,B.length),rs=[...String(s)].reverse();

  const st=[{t:'Schreibe die Zahlen genau untereinander: Einer unter Einer, Zehner unter Zehner, Hunderter unter Hunderter.',why:'Man darf nur gleiche Stellen zusammenzählen. Die bunten Buchstaben oben zeigen die Stellen: E = Einer, Z = Zehner, H = Hunderter, T = Tausender.',vis:view(0,null)}];
  let c=0;
  for(let i=0;i<n;i++){const x=+(A[i]||0),y=+(B[i]||0),t=x+y+c,had=c;c=t>=10?1:0;if(c)carry[w-2-i]='1';
    let why=i===0?'Man fängt immer rechts bei den Einern an. So kann ein Übertrag nach links weiterwandern.':'';
    if(t>=10)why=`${t} ${STELLE[i]} sind 1 ${STELLE[i+1]} und ${t%10} ${STELLE[i]}. Die 1 gehört in die ${STELLE[i+1]}-Spalte. Darum schreibst du sie dort klein hin.`;
    else if(had)why='Die kleine 1 von vorhin gehört zu dieser Spalte. Sie wird mitgezählt.';
    st.push({t:`<b>${STELLE[i]}:</b> ${x} + ${y}${had?' + <b>1</b>':''} = ${t}. ${t>=10?`Schreibe <b>${t%10}</b> und merke dir <b>1</b>.`:`Schreibe <b>${t}</b>.`}`,why,vis:view(Math.min(i+1,L),i)})}
  if(c)st.push({t:'Die gemerkte 1 schreibst du ganz vorne ins Ergebnis.',why:'Es gibt keine weitere Spalte, zu der sie dazukommen kann.',vis:view(L,n)});
  const rd=v=>v>=1000?Math.round(v/1000)*1000:v>=100?Math.round(v/100)*100:Math.round(v/10)*10;
  st.push({t:`Ergebnis: <b>${fmt(s)}</b>`,why:`Überschlag zum Prüfen: ${fmt(rd(a))} + ${fmt(rd(b))} = ${fmt(rd(a)+rd(b))}. ${fmt(s)} liegt in der Nähe, also passt es.`,vis:view(L,null)});
  return{answer:s,visual:view(0,null),steps:st}}
function solveSub(a,b){
  const d=a-b,w=String(a).length+1,A=[...String(a)].reverse(),B=[...String(b)].reverse(),L=String(d).length,rs=[...String(d)].reverse();let c=0;const carry=Array(w).fill(' ');
  const view=(done,col)=>gridX([{s:a},{s:'−'+String(b).padStart(w-1,' ')},{s:carry.join(''),cls:'carry'},{s:Array.from({length:L},(_,k)=>k<done?rs[k]:'_').reverse().join(''),cls:'res'+(done>=L?' done':'')}],w,{head:1,act:col==null?[]:[w-1-col]});
  const st=[{t:'Schreibe die Zahlen genau untereinander. Wir rechnen mit dem <b>Ergänzen</b>: Wir fragen von unten nach oben „Wie viel fehlt?“.',why:'Beim Ergänzen rechnest du plus statt minus. Plus fällt vielen Kindern leichter.',vis:view(0,null)}];
  for(let i=0;i<A.length;i++){const t=+A[i],y=+(B[i]||0),x=y+c,had=c,last=i===A.length-1;let txt=`<b>${STELLE[i]}:</b> `+(had?`Unten ${y} + 1 (gemerkt) = ${x}. `:''),why='';
    if(x<=t){const r=t-x;txt+=`${x} + <b>?</b> = ${t} → <b>${r}</b>. `+(last&&r===0&&i>0?'Eine 0 ganz vorne schreibt man nicht.':`Schreibe <b>${r}</b>.`);c=0;
      why=had?'Die gemerkte 1 kommt unten zur Zahl dazu. Dann ergänzt du wie immer.':i===0?'Wir fangen rechts bei den Einern an, weil ein Übertrag nach links wandert.':`Von ${x} bis ${t} fehlen ${r}.`}
    else{const r=t+10-x;txt+=`${x} + ? = ${t} geht nicht! Also ${x} + <b>?</b> = ${t+10} → <b>${r}</b>. Schreibe <b>${r}</b>, merke <b>1</b>.`;c=1;carry[w-2-i]='1';
      why=`Oben steht nur ${t}, das ist weniger als ${x}. Darum ergänzen wir bis ${t+10}. Den geliehenen Zehner geben wir zurück: Als kleine 1 kommt er unten zur nächsten Spalte.`}
    st.push({t:txt,why,vis:view(Math.min(i+1,L),i)})}
  st.push({t:`Ergebnis: <b>${fmt(d)}</b>`,why:`Probe: ${fmt(d)} + ${fmt(b)} = ${fmt(a)}. Stimmt! Bei Minus kannst du immer mit Plus prüfen.`,vis:view(L,null)});
  return{answer:d,visual:view(0,null),steps:st}}
function solveMul1(a,m){
  const p=a*m,A=[...String(a)].reverse(),L=String(p).length,w=Math.max(String(a).length+2,L),rs=[...String(p)].reverse();const carry=Array(w).fill(' ');
  const view=(done,col)=>gridX([{s:`${a}·${m}`},{s:carry.join(''),cls:'carry'},{s:Array.from({length:L},(_,k)=>k<done?rs[k]:'_').reverse().join(''),cls:'res'+(done>=L?' done':'')}],w,{act:col==null?[]:[w-3-col,w-1-col]});
  const st=[{t:`Du nimmst jede Ziffer von ${a} einzeln mal ${m}. Fang rechts bei den Einern an.`,why:`${a} besteht aus ${placeParts(a).join(' + ')}. Jeden Teil nehmen wir mal ${m}. Das Ergebnis schreibst du rechtsbündig unter die Aufgabe.`,vis:view(0,null)}];let c=0;
  A.forEach((dg,i)=>{const x=m*dg+c,had=c,last=i===A.length-1;
    const txt=`<b>${STELLE[i]}:</b> ${m} · ${dg} = ${m*dg}${had?` + ${had} (gemerkt) = ${x}`:''}. `+(last?`Schreibe <b>${x}</b>.`:x>=10?`Schreibe <b>${x%10}</b>, merke <b>${Math.floor(x/10)}</b>.`:`Schreibe <b>${x}</b>.`);
    const why=last&&x>=10?'Das ist die letzte Ziffer. Darum schreibst du die ganze Zahl hin.':x>=10?`${x} ${STELLE[i]} sind ${Math.floor(x/10)} ${STELLE[i+1]} und ${x%10} ${STELLE[i]}. Die ${Math.floor(x/10)} wandert als Übertrag in die nächste Spalte.`:had?'Den Übertrag von vorhin rechnest du nach dem Malnehmen dazu.':'Einmaleins-Aufgabe aus dem Kopf.';
    c=last?0:Math.floor(x/10);if(c)carry[w-2-i]=String(c);
    st.push({t:txt,why,vis:view(last?L:i+1,i)})});
  const ra=Math.round(a/100)*100||a;
  st.push({t:`Ergebnis: <b>${fmt(p)}</b>`,why:`Überschlag: ${fmt(ra)} · ${m} = ${fmt(ra*m)}. Das Ergebnis liegt in der Nähe.`,vis:view(L,null)});
  return{answer:p,visual:view(0,null),steps:st}}
function solveMulBig(a,b){const parts=placeParts(b),p=a*b;
  const st=[{t:`Zerlege ${b} in ${parts.join(' + ')}. Dann rechnest du ${a} mal jeden Teil.`,why:'Große Malaufgaben baust du aus kleinen zusammen. Das nennt man halbschriftlich rechnen.',vis:stt(b)}];
  parts.forEach(x=>{const z=String(x).match(/0+$/),dg=z?x/Math.pow(10,z[0].length):x;
    st.push(z?{t:`${a} · ${fmt(x)}: Rechne ${a} · ${dg} = ${fmt(a*dg)}, dann hänge ${z[0].length===1?'eine 0':z[0].length+' Nullen'} an → <b>${fmt(a*x)}</b>`,why:`Mal ${Math.pow(10,z[0].length)} verschiebt alle Ziffern um ${z[0].length} ${z[0].length===1?'Stelle':'Stellen'} nach links. Darum kommt hinten eine 0 dazu.`}:{t:`${a} · ${x} = <b>${fmt(a*x)}</b>`,why:'Das ist der Einer-Teil.'})});
  st.push({t:`Zähle alles zusammen: ${parts.map(x=>fmt(a*x)).join(' + ')} = <b>${fmt(p)}</b>`,why:'Alle Teile zusammen ergeben die ganze Aufgabe.'});
  return{answer:p,steps:st}}
function solveDiv(a,d){
  if(a%d===0&&a/d<=10&&d<=10)return{answer:a/d,steps:divKlein(a,d)};
  const D=[...String(a)];let cur=0,qs='',started=false;const st=[{t:`Wir teilen schriftlich: ${fmt(a)} : ${d}. Fang links an und nimm so viele Ziffern, bis die Zahl mindestens ${d} ist.`,why:'Beim Teilen fängt man links bei der größten Stelle an. So bleibt jeder Schritt eine kleine Einmaleins-Aufgabe.'}];
  D.forEach((ch,i)=>{const prev=cur;cur=cur*10+ +ch;
    if(!started&&cur<d){if(i<D.length-1)st.push({t:`${cur} ist kleiner als ${d}. Nimm die nächste Ziffer dazu.`,why:`${d} passt in ${cur} noch nicht hinein.`});else{st.push({t:`${cur} ist kleiner als ${d}. Das Ergebnis ist 0.`});qs='0'}return}
    const hol=started?`Hole die ${ch} herunter: Aus dem Rest ${prev} wird <b>${cur}</b>. `:'';started=true;
    const q=Math.floor(cur/d),r=cur-q*d;qs+=q;
    st.push({t:`${hol}Wie oft passt ${d} in ${cur}? <b>${q}-mal</b>, denn ${q} · ${d} = ${q*d}. Rest: ${cur} − ${q*d} = ${r}.`,why:hol?`Der Rest ist noch nicht verteilt. Mit der nächsten Ziffer wird er zehnmal so viel und wir teilen weiter.`:`${q+1} · ${d} = ${(q+1)*d} wäre schon zu viel. Darum passt ${d} nur ${q}-mal.`});cur=r});
  const Q=+qs;
  st.push({t:`Ergebnis: <b>${fmt(Q)}${cur?` Rest ${cur}`:''}</b>`,why:`Probe: ${fmt(Q)} · ${d}${cur?` + ${cur}`:''} = ${fmt(a)} ✓`});
  return{answer:Q,rest:cur,steps:st}}
function solveTask(a,op,b){
  if(op==='+'){if(a<1000&&b<1000&&a+b<=1000&&((a<100&&b<100)||placeParts(b).length<=2))return{answer:a+b,steps:halbAdd(a,b)};return solveAdd(a,b)}
  if(op==='-'){if(b>a)return{error:'Die erste Zahl muss größer sein als die zweite. Schau noch einmal ins Heft.'};if(b===0)return{answer:a,steps:[{t:`Minus 0 ändert nichts: ${a} − 0 = <b>${a}</b>`,why:'Wenn du nichts wegnimmst, bleibt alles da.'}]};if(a<=100||(a<1000&&placeParts(b).length<=2))return{answer:a-b,steps:halbSub(a,b)};return solveSub(a,b)}
  if(op==='*'){let x=a,y=b,swap='';if(y>x&&!(x<=10&&y<=10)){[x,y]=[y,x];swap=`Tauschaufgabe: ${a} · ${b} ist dasselbe wie ${x} · ${y}. So ist es leichter.`}
    if(x<=10&&y<=10)return{answer:a*b,steps:malKlein(a,b)};
    const r=y<=9?solveMul1(x,y):solveMulBig(x,y);if(swap)r.steps.unshift({t:swap,why:'Beim Malnehmen darf man die Zahlen tauschen. Das Ergebnis bleibt gleich.'});return r}
  if(op===':'){if(b===0)return{error:'Durch 0 kann man nicht teilen.'};if(b===1)return{answer:a,steps:[{t:`Geteilt durch 1 ändert nichts: ${a} : 1 = <b>${a}</b>`,why:'Wenn alles an eine Person geht, bekommt sie alles.'}]};return solveDiv(a,b)}
}

function clockSVG(h,m){
  let t='';for(let i=0;i<60;i++){const a=i*6*Math.PI/180,big=i%5===0,r1=big?80:85;t+=`<line class="tick ${big?'big':''}" x1="${100+r1*Math.sin(a)}" y1="${100-r1*Math.cos(a)}" x2="${100+91*Math.sin(a)}" y2="${100-91*Math.cos(a)}"/>`}
  let n='';for(let i=1;i<=12;i++){const a=i*30*Math.PI/180;n+=`<text class="num" x="${100+66*Math.sin(a)}" y="${100-66*Math.cos(a)}">${i}</text>`}
  const ha=((h%12)+m/60)*30*Math.PI/180,ma=m*6*Math.PI/180;
  return `<div class="fig"><svg viewBox="0 0 200 200" role="img" aria-label="Uhr"><circle class="face" cx="100" cy="100" r="94"/>${t}${n}
  <line class="hh" x1="100" y1="100" x2="${100+42*Math.sin(ha)}" y2="${100-42*Math.cos(ha)}"/><line class="mh" x1="100" y1="100" x2="${100+74*Math.sin(ma)}" y2="${100-74*Math.cos(ma)}"/><circle class="hub" cx="100" cy="100" r="6"/></svg></div>`;
}
const hh=h=>((h-1)%12+12)%12+1;
const tStr=(h,m)=>`${h}:${String(m).padStart(2,'0')} Uhr`;
function spoken(h,m){const n=hh(h+1);
  if(m===0)return`${h} Uhr`;if(m===15)return`Viertel nach ${h}`;if(m===30)return`halb ${n}`;if(m===45)return`Viertel vor ${n}`;
  if(m===25)return`5 vor halb ${n}`;if(m===35)return`5 nach halb ${n}`;return m<30?`${m} nach ${h}`:`${60-m} vor ${n}`}
function uhrQ(ms){const h=R(1,12),m=pick(ms);const ok=tStr(h,m);const opts=new Set([ok]);
  const cand=[tStr(hh(h+1),m),tStr(h,(m+30)%60),tStr(hh(h-1),m),tStr(hh(m/5||12),(h%12)*5),tStr(h,(m+15)%60)];
  for(const c of shuf(cand)){if(opts.size>=4)break;opts.add(c)}
  const pos=m/5||12;
  return{kind:'choice',text:'Wie spät ist es?',visual:clockSVG(h,m),options:shuf([...opts]),answer:ok,
    steps:['Der <b>kurze</b> Zeiger zeigt die Stunden. Der <b>lange</b> Zeiger zeigt die Minuten.',
      m===0?`Der kurze Zeiger steht genau auf der <b>${h}</b>.`:`Der kurze Zeiger ist schon ein Stück hinter der <b>${h}</b>, aber noch nicht bei der ${hh(h+1)}. Also ist es ${h} Uhr und etwas.`,
      `Der lange Zeiger zeigt auf die ${pos}. Jede Zahl bedeutet 5 Minuten: ${pos===12?'auf der 12 sind es 0 Minuten':`${pos} · 5 = <b>${m} Minuten</b>`}.`,
      `Es ist <b>${ok}</b>. Man sagt auch: „${spoken(h,m)}“.`]}}
const tf=t=>`${Math.floor(t/60)}:${String(t%60).padStart(2,'0')} Uhr`;
M.uhr2=()=>uhrQ([0,15,30,45]);
M.uhr3=()=>uhrQ([0,5,10,15,20,25,30,35,40,45,50,55]);
M.zeitspanne=()=>{let h,m,d;do{h=R(8,17);m=R(1,11)*5;d=R(4,19)*5}while(d<=60-m);
  const s=h*60+m,e=s+d,a=60-m,rest=d-a;
  const legs=[`Von ${tf(s)} bis zur vollen Stunde ${tf(s+a)} sind es <b>${a} Minuten</b>.`];
  if(Math.random()<.5){
    if(rest>=60)legs.push(`Von ${tf(s+a)} bis ${tf(s+a+60)} ist <b>1 Stunde = 60 Minuten</b>.`);
    legs.push(`Von ${tf(rest>=60?s+a+60:s+a)} bis ${tf(e)} sind es <b>${rest%60} Minuten</b>.`);
    return{kind:'num',unit:'min',long:1,text:`Das Fußballtraining geht von ${tf(s)} bis ${tf(e)}. Wie viele Minuten dauert es?`,answer:d,
      steps:['Tipp: Rechne in Sprüngen bis zur vollen Stunde.',...legs,`Zusammen: ${a}${rest>=60?' + 60':''} + ${rest%60} = <b>${d} Minuten</b>`]}}
  const ok=tf(e),opts=shuf([...new Set([ok,tf(e+10),tf(e-10),tf(e+60)])]);
  return{kind:'choice',long:1,text:`Der Film beginnt um ${tf(s)} und dauert ${d} Minuten. Wann ist er zu Ende?`,options:opts,answer:ok,
    steps:[`Zerlege die ${d} Minuten: erst ${a} Minuten bis zur vollen Stunde, dann den Rest.`,`${tf(s)} + ${a} Minuten = ${tf(s+a)}`,`Es bleiben noch ${d} − ${a} = ${rest} Minuten${rest>=60?` (1 Stunde und ${rest-60} Minuten)`:''}.`,`${tf(s+a)} + ${rest} Minuten = <b>${ok}</b>`]}};

function diktat(g){return()=>{const[raw,merk]=pick(DIK[g]);const w=raw.replace(/-/g,''),sent=g===4;
  const base=sent?[`Der Satz heißt: <b>${esc(w)}</b>`,'Satzanfang groß, Nomen groß und am Ende ein Punkt.']:[`Das Wort heißt: <b>${w}</b>`,`Sprich in Silben mit: ${raw.split('-').join(' – ')}`,merk||'Nomen schreibt man groß.'];
  return{kind:'text',sentence:sent,visual:g===2?picBox(PIC[w]):'',text:canSpeak?(sent?'Hör genau zu und schreibe den Satz.':'Hör genau zu und schreibe das Wort.'):(sent?'Lies den Satz, merke ihn dir und schreibe ihn auswendig.':'Lies das Wort, merke es dir und schreibe es auswendig.'),
    answer:w,say:w,help:[null,sent?'Hör dir den Satz noch einmal an und schreibe Wort für Wort. Nomen und der Satzanfang werden großgeschrieben.':`Sprich in Silben mit: ${raw.split('-').join(' – ')}`],hintText:sent?`Der Satz hat ${w.split(' ').length} Wörter. Denk an den großen Anfang und den Punkt.`:`Das Wort hat ${w.length} Buchstaben und fängt mit „${w[0]}“ an.`,
    steps:base,fail:given=>{const hl=sent?markWords(given,w):markChars(given,w);const st=[`Du hast geschrieben: „${esc(given)}“`,`Richtig ist: <b>${hl}</b> (die markierten Stellen)`];
      if(given.toLowerCase()===w.toLowerCase())st.push('Achte auf Groß- und Kleinschreibung: Nomen und Satzanfänge schreibt man groß.');
      else if(sent&&!given.trim().endsWith('.'))st.push('Denk an den Punkt am Ende des Satzes.');
      st.push(...base.slice(1));return st}}}}
function markChars(g,w){return[...w].map((c,i)=>c===g[i]?esc(c):`<mark>${esc(c)}</mark>`).join('')}
function markWords(g,w){const gw=g.trim().split(/\s+/);return w.split(' ').map((x,i)=>x===gw[i]?esc(x):`<mark>${esc(x)}</mark>`).join(' ')}

/* ---------- Keine Wiederholungen + Wiederholen mit Abständen ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function genSeeded(gen,seed){const o=Math.random;Math.random=mulberry32(seed);let q;try{q=gen()}finally{Math.random=o}q._seed=seed;return q}
const hashS=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h};
const qKey=q=>(plain(q.text)+'|'+q.answer+'|'+hashS(String(q.visual||''))).slice(0,240);
const today=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5);
const TK=()=>`${S.subj}|${S.grade}|${S.topic[0]}`;
const newSeed=()=>(Math.random()*2147483647)|0;
function findTopic(tk){const[s,g,id]=tk.split('|');const sub=SUBJECTS.find(x=>x.id===s);if(!sub)return null;const t=(sub.grades[g]||[]).find(x=>x[0]===id);return t?{sub,g:+g,t}:null}
const WR_DAYS=[0,1,3,7],TOPIC_DAYS=[1,2,4,7,14];
function addWrong(q){if(!q||!q._tk)return;const P=me();P.wrong=P.wrong||[];const w=P.wrong.find(x=>x.key===q._key);
  if(w){w.box=1;w.due=today()+1}else P.wrong.push({tk:q._tk,seed:q._seed,key:q._key,box:1,due:today()+1});if(P.wrong.length>60)P.wrong.splice(0,P.wrong.length-60);save()}
function promote(q,good){const P=me();if(!P.wrong||!q||!q._key)return;const i=P.wrong.findIndex(x=>x.key===q._key);if(i<0)return;const w=P.wrong[i];
  if(!good){w.box=1;w.due=today()+1}else{w.box++;if(w.box>3)P.wrong.splice(i,1);else w.due=today()+WR_DAYS[w.box]}save()}
function dueWrong(){const t=today();return(me().wrong||[]).filter(w=>w.due<=t&&findTopic(w.tk))}
function dueTopics(){const t=today(),sc=me().sched||{};return Object.entries(sc).map(([tk,v])=>({tk,...v})).filter(v=>v.due<=t&&findTopic(v.tk)).sort((a,b)=>a.due-b.due)}
function markTopic(ratio){const P=me();P.sched=P.sched||{};const tk=TK(),old=P.sched[tk];const box=ratio>=.75?Math.min((old&&old.box||0)+1,5):1;
  P.sched[tk]={last:today(),box,due:today()+TOPIC_DAYS[box-1],name:S.topic[1],sid:S.subj,g:S.grade}}
function startReview(){const qs=[],keys=new Set();
  const push=(f,tk,seed)=>{const q=genSeeded(f.t[3],seed);q._tk=tk;q._key=qKey(q);q._sid=f.sub.id;q._tname=f.t[1];if(keys.has(q._key))return;keys.add(q._key);qs.push(q)};
  dueWrong().slice(0,6).forEach(w=>{const f=findTopic(w.tk);if(f)push(f,w.tk,w.seed)});
  const tops=dueTopics();for(let i=0;qs.length<8&&tops.length&&i<60;i++){const tp=tops[i%tops.length],f=findTopic(tp.tk);if(f)push(f,tp.tk,newSeed())}
  if(!qs.length){toast('Heute gibt es nichts zu wiederholen. Super gemacht!',4000);return}
  stopSpeech();S.screen='quiz';Q={qs:shuf(qs),i:0,res:[],earned:0,n:qs.length,review:true,fails:{},t0:Date.now()};S.rv=null;startQ();window.scrollTo(0,0)}
function reviewCard(){const w=dueWrong(),t=dueTopics(),any=Object.keys(me().sched||{}).length;
  if(!any)return`<div class="rcard"><div class="rc-h">${owl('think',44)}<div><b>Wiederholen</b><br><span>Übe ein paar Themen. Stella erinnert dich dann nach ein paar Tagen ans Wiederholen.</span></div></div></div>`;
  if(!w.length&&!t.length){const nx=Object.values(me().sched).map(v=>v.due).sort((a,b)=>a-b)[0];const d=nx-today();return`<div class="rcard done"><div class="rc-h">${owl('happy',44)}<div><b>Heute ist alles wiederholt!</b><br><span>Die nächste Wiederholung ist ${d<=1?'morgen':`in ${d} Tagen`} dran.</span></div></div></div>`}
  return`<div class="rcard"><div class="rc-h">${owl('think',44)}<div><b>Heute wiederholen</b><br><span>${w.length?`${w.length} ${w.length===1?'Aufgabe':'Aufgaben'} von früher`:''}${w.length&&t.length?' und ':''}${t.length?`${t.length} ${t.length===1?'Thema':'Themen'}`:''} ${w.length+t.length===1?'ist':'sind'} wieder dran.</span></div></div>
  ${t.length?`<div class="rc-chips">${t.slice(0,6).map(x=>`<button class="chip2" data-act="goTopic" data-tk="${esc(x.tk)}" style="--c:var(${(SUBJECTS.find(s=>s.id===x.sid)||{}).color||'--c-ma'})">${esc(x.name)}</button>`).join('')}</div>`:''}
  <button class="btn" data-act="review0">Wiederholung starten</button></div>`}
function renderReviewResult(){const e=Q.earned,N=Q.n;
  app.innerHTML=`${bar('home','Wiederholen','Geschafft!')}<div class="result">${owl(e>=N/2?'cheer':'happy',110)}<h2>Wiederholung geschafft!</h2>
  <div class="bigstars">${Array.from({length:N},(_,i)=>`<span style="display:contents">${STAR.replace('<svg',`<svg class="${i<e?'on':''}" style="animation-delay:${i*90}ms"`)}</span>`).join('')}</div>
  <div class="score">${e} von ${N} richtig</div><p>${e===N?'Alles sitzt! Diese Aufgaben kommen erst in ein paar Tagen wieder.':'Was noch nicht geklappt hat, kommt morgen noch einmal dran. So bleibt es im Kopf.'}</p>
  <div class="row" style="width:100%"><button class="btn" data-act="home">Zur Startseite</button></div></div>`}

/* ================= NEU: Sinnerfassung, Überschlag, Großschreibung, Dialoge, Hören, Tagesziel, Eltern-Überblick ================= */

/* ---------- Mathe: Überschlagsrechnen ---------- */
M.ueberschlag=function(){
  const p=Math.random()<.5?10:100;let a,b,op=pick(['+','−']);
  if(p===10){a=R(41,89);b=op==='−'?R(11,a-12):R(11,89)}
  else{a=R(300,890);b=op==='−'?R(110,a-110):R(110,880)}
  const ra=Math.round(a/p)*p,rb=Math.round(b/p)*p;
  const est=op==='+'?ra+rb:ra-rb,exact=op==='+'?a+b:a-b;
  const opts=new Set([est]);while(opts.size<4)opts.add(est+pick([-2,-1,1,2])*p);
  const nm=p===10?'Zehner':'Hunderter';
  return{kind:'choice',long:1,text:`Schätze zuerst, ohne genau zu rechnen: ${a} ${op} ${b} ≈ ?`,options:shuf([...opts].map(fmt)),answer:fmt(est),
    steps:[
      {t:`${chip('f','Überschlag')} Runde beide Zahlen auf ${nm}: ${a} ≈ <b>${ra}</b>, ${b} ≈ <b>${rb}</b>`,why:'Beim Überschlagen rundest du zuerst. So kannst du im Kopf rechnen, ohne alles genau auszurechnen.'},
      {t:`Rechne mit den runden Zahlen: ${ra} ${op} ${rb} = <b>${est}</b>`,why:`Runde ${nm} wie ${ra} und ${rb} kann man leicht im Kopf rechnen.`},
      {t:`Das genaue Ergebnis wäre ${a} ${op} ${b} = ${fmt(exact)}. Dein Überschlag <b>${fmt(est)}</b> liegt nah dran.`,why:'Ein Überschlag muss nicht genau stimmen. Er hilft dir zu prüfen, ob ein genaues Ergebnis überhaupt sinnvoll sein kann.'}
    ]}};

/* ---------- Mathe: Welche Rechenart passt? (Sinnerfassung) ---------- */
const OPNAME={'+':'plus (zusammenzählen)','−':'minus (wegnehmen, Unterschied finden)','·':'mal (mehrmals das Gleiche)',':':'geteilt (aufteilen, verteilen)'};
const RART=[
  (a,b)=>({op:'+',t:`Mia hat ${a} Murmeln. Sie bekommt ${b} weitere Murmeln geschenkt. Wie viele Murmeln hat sie jetzt?`,hint:'"bekommt dazu, geschenkt" → es wird mehr, man zählt zusammen'}),
  (a,b)=>({op:'+',t:`Im Zoo leben ${a} Affen und ${b} Papageien. Wie viele Tiere sind das zusammen?`,hint:'"zusammen" → man zählt beides zusammen'}),
  (a,b)=>({op:'−',t:`Auf dem Parkplatz stehen ${a} Autos. ${b} Autos fahren weg. Wie viele Autos stehen jetzt noch da?`,hint:'"fahren weg" → es wird weniger, man nimmt weg'}),
  (a,b)=>({op:'−',t:`Tom hat ${a} €. Er kauft ein Buch für ${b} €. Wie viel Geld hat er noch übrig?`,hint:'"übrig, noch" → man zieht ab'}),
  (a,b)=>({op:'·',t:`Im Klassenzimmer stehen ${a} Tische. An jedem Tisch sitzen ${b} Kinder. Wie viele Kinder sitzen insgesamt im Klassenzimmer?`,hint:'"an jedem" → gleich viele, mehrmals das Gleiche → malnehmen'}),
  (a,b)=>({op:'·',t:`Ein Heft kostet ${b} €. Lena kauft ${a} Hefte. Wie viel muss sie bezahlen?`,hint:'"jedes kostet gleich viel" → gleiche Preise mehrmals → malnehmen'}),
  (a,b)=>({op:':',t:`${a} Bonbons werden gleichmäßig an ${b} Kinder verteilt. Wie viele Bonbons bekommt jedes Kind?`,hint:'"gleichmäßig verteilen" → teilen'}),
  (a,b)=>({op:':',t:`${a} Kinder sollen in Gruppen zu je ${b} Kindern eingeteilt werden. Wie viele Gruppen entstehen?`,hint:'"in Gruppen zu je" → aufteilen in gleich große Teile → teilen'})
];
M.rechenart=function(){

/* ---------- Tagesziel ---------- */
const DAILY_GOAL=5;
function bumpDay(){const P=me(),t=today();if(!P.day||P.day.d!==t)P.day={d:t,n:0};P.day.n++}
function dayGoalCard(){const P=me(),t=today(),n=(P.day&&P.day.d===t)?P.day.n:0,done=n>=DAILY_GOAL,pct=Math.min(100,Math.round(n/DAILY_GOAL*100));
  return`<div class="rcard ${done?'done':''}"><div class="rc-h">${owl(done?'cheer':'think',44)}<div><b>Tagesziel</b><br><span>${done?`Super, du hast dein Ziel von ${DAILY_GOAL} Sternen heute schon geschafft!`:`Noch ${DAILY_GOAL-n} ${DAILY_GOAL-n===1?'Stern':'Sterne'} bis zum Tagesziel.`}</span></div></div><div class="rankbar" style="margin-top:10px"><i style="width:${pct}%"></i></div></div>`}

/* ---------- Eltern-Überblick ---------- */
function renderEltern(){
  const P=me(),t=today(),items=[];
  SUBJECTS.forEach(s=>{[2,3,4].forEach(g=>{(s.grades[g]||[]).forEach(top=>{
    const k=`${s.id}-${g}-${top[0]}`,b=P.best[k];if(b==null)return;
    const test=(P.test||{})[k],sc=(P.sched||{})[k];
    items.push({sub:s.name,color:s.color,grade:g,name:top[1],best:b,medal:test!=null?medalOf(test):null,due:sc?sc.due:null});
  });});});
  items.sort((a,b)=>a.sub.localeCompare(b.sub,'de')||a.grade-b.grade);
  const total=SUBJECTS.reduce((n,s)=>n+[2,3,4].reduce((m,g)=>m+(s.grades[g]||[]).length,0),0);
  const dueCount=items.filter(x=>x.due!=null&&x.due<=t).length;
  app.innerHTML=`${bar('home','Eltern-Überblick',`Fortschritt von ${esc(P.name)}`)}
  <section><div class="label">Auf einen Blick</div><div class="rcard"><div class="rc-h">${owl('happy',44)}<div><b>${P.stars} Sterne gesammelt</b><br><span>${items.length} von ${total} Themen schon geübt${dueCount?` · ${dueCount} ${dueCount===1?'Thema ist':'Themen sind'} heute zur Wiederholung fällig`:''}</span></div></div></div></section>
  ${items.length?`<section><div class="label">Geübte Themen</div><div class="topics">${items.map(x=>`<div class="topic" style="--c:var(${x.color})"><span class="tx"><span class="nm">${esc(x.name)}</span><br><span class="ds">${esc(x.sub)} · Klasse ${x.grade}${x.due!=null?` · Wiederholen: ${x.due<=t?'heute':`in ${x.due-t} Tagen`}`:''}</span></span>${x.medal?medalSVG(x.medal,22):''}<span class="best">${STAR}${x.best}/${ROUND}</span></div>`).join('')}</div></section>`:`<p class="note">Noch keine Themen geübt.</p>`}
  <p class="note">Diese Übersicht zeigt, was ${esc(P.name)} auf diesem Gerät geübt hat. Die Daten sind nur lokal in diesem Browser gespeichert, nicht online.</p>`;
}

function parseMoney(s){s=String(s);if(!s.includes(','))return(+s)*100;const[e,c]=s.split(',');return(+e||0)*100+ +((c+'00').slice(0,2))}
function helpList(q){if(q.help)return q.help.map(x=>x===null?q.hintText:x);return q.steps.length>1?q.steps.slice(0,-1):[]}
function check(given){
  const q=cur();Q.tries++;
  if(q.kind==='text')given=given.trim().replace(/\s+/g,' ');
  const ok=q.kind==='speak'?given===true:(q.money||q.dec)?parseMoney(given)===q.answer:q.kind==='build'?given===q.answer:q.kind==='num'?Number(given)===q.answer:given===q.answer;
  if(q.kind==='build'&&!ok)Q.buildMsg=given<q.answer?`Noch zu wenig! Es fehlen ${euro(q.answer-given)}.`:`Das ist zu viel! ${euro(given-q.answer)} zu viel.`;
  if(!ok&&q.kind==='text'){Q.steps=q.fail(given);Q.fails[Q.i]=Q.steps}
  if(ok){promote(q,Q.tries===1&&Q.help===0);Q.state='ok';Q.res.push(true);Q.earned++;me().stars++;bumpDay();save();renderQuiz();popPill();tone('ok');return}
  tone('no');
  if(Q.test||Q.review&&false){Q.state='tw';Q.res.push(false);addWrong(q);if(q.kind==='choice')Q.wrong.push(given);renderQuiz();return}
  if(q.kind==='choice')Q.wrong.push(given);
  if(Q.tries>=2||(q.kind==='choice'&&q.options.length-Q.wrong.length<=1)){Q.state='explain';Q.shown=1;Q.res.push(false);addWrong(q);renderQuiz();scrollTafel();autoSpeak('quiz');return}
  Q.state='retry';if(q.kind!=='text'&&q.kind!=='build')Q.input='';
  renderQuiz();
}

  ${all&&q.kind!=='text'&&q.kind!=='speak'?`<div class="sol">Lösung: ${solText(q)}</div>`:''}${all&&q.solVis?`<div class="solvis">${q.solVis}</div>`:''}
  ${all?`<div class="row"><button class="btn ghost" data-act="lnew">Noch ein Beispiel</button><button class="btn" data-act="practice">Jetzt übe ich!</button></div>`:''}</div>
  ${all?'':`<button class="linkbtn" data-act="practice" style="align-self:center">Ich kann das schon – direkt üben</button>`}</div>`;
}

/* ---------- Hausaufgaben-Helfer ---------- */
const OPS=[['+','+','plus'],['-','−','minus'],['*','·','mal'],[':',':','geteilt']];
function renderHelper(){
  const h=S.h,opSym=OPS.find(o=>o[0]===h.op)[1];let out='';
  if(h.res&&h.res.error)out=`<div class="fb warn"><h3>Das geht so nicht</h3><p>${h.res.error}</p></div>`;
  else if(h.res){const r=h.res,all=h.shown>=r.steps.length;
    out=`<div class="qcard"><div class="label">Deine Aufgabe</div><div class="qtext">${fmt(h.na)} ${opSym} ${fmt(h.nb)} = ?</div></div>
    <div class="fb explain">${tafelHTML('helper',r.steps,h.shown)}
    ${all?`<div class="sol">Lösung: ${fmt(r.answer)}${r.rest?` Rest ${r.rest}`:''}</div><div class="row"><button class="btn ghost" data-act="hnew">Neue Aufgabe</button></div>`:''}</div>
    ${all?'':'<p class="note">Tipp: Rechne jeden Schritt selbst im Heft mit, bevor du weitertippst.</p>'}`}
  app.innerHTML=`${bar('home','Hausaufgaben-Helfer','Tippe deine Rechenaufgabe aus dem Heft ein')}
  <div style="--c:var(--c-ma);display:flex;flex-direction:column;gap:16px">
  <div class="qcard"><div class="helprow">
    <input id="ha" class="dinput num" inputmode="numeric" pattern="[0-9]*" maxlength="7" placeholder="Zahl" aria-label="Erste Zahl" value="${esc(h.a)}">
    <div class="ops">${OPS.map(o=>`<button class="op ${h.op===o[0]?'on':''}" data-act="hop" data-op="${o[0]}" aria-label="${o[2]}">${o[1]}</button>`).join('')}</div>
    <input id="hb" class="dinput num" inputmode="numeric" pattern="[0-9]*" maxlength="7" placeholder="Zahl" aria-label="Zweite Zahl" value="${esc(h.b)}">
  </div><button class="btn" data-act="hsolve">Erklär’s mir Schritt für Schritt</button></div>
  ${out}</div>`;
}
function helperSolve(){const h=S.h;h.a=document.getElementById('ha').value;h.b=document.getElementById('hb').value;
  const a=parseInt(h.a.replace(/\D/g,''),10),b=parseInt(h.b.replace(/\D/g,''),10);h.shown=1;stopSpeech();
  if(isNaN(a)||isNaN(b)){h.res={error:'Bitte trage in beide Felder eine Zahl ein.'};renderHelper();return}
  h.na=a;h.nb=b;h.res=solveTask(a,h.op,b);renderHelper();if(!h.res.error){scrollTafel();autoSpeak('helper')}}

function act(a,d){
  switch(a){
    case 'home':S.screen='home';render();break;
    case 'eltern':S.screen='eltern';render();break;
    case 'profile':store.active=+d.i;save();renderHome();break;
    case 'editName':S.editing=+d.i;renderHome();break;
    case 'saveName':{const inp=document.getElementById('nm'+d.i);const v=(inp&&inp.value.trim())||store.profiles[d.i].name;store.profiles[d.i].name=v;store.active=+d.i;S.editing=-1;save();renderHome();break}
    case 'subject':S.subj=d.id;S.screen='topics';render();break;
    case 'grade':S.grade=+d.g;renderTopics();break;
    case 'topics':S.screen='topics';Q=null;render();break;
    case 'topic':S.topic=subj().grades[S.grade][+d.i];S.screen='hub';render();break;
    case 'hub':S.screen='hub';render();break;
    case 'review0':startReview();break;
    case 'goTopic':{const f=findTopic(d.tk);if(!f)break;S.subj=f.sub.id;S.grade=f.g;S.topic=f.t;S.screen='hub';render();break}
    case 'goLearn':S.lq=S.topic[3]();S.lshown=1;S.screen='lesson';render();autoSpeak('lesson');break;
    case 'lnew':stopSpeech();S.lq=S.topic[3]();S.lshown=1;renderLesson();window.scrollTo(0,0);autoSpeak('lesson');break;
    case 'lsay':say(S.lq.say,S.subj==='en'?'en-GB':'de-DE',.8);break;
    case 'practice':S.screen='quiz';stopSpeech();newRound(false);window.scrollTo(0,0);break;
    case 'again':S.screen='quiz';stopSpeech();newRound(false);window.scrollTo(0,0);break;
    case 'goTest':S.screen='quiz';stopSpeech();newRound(true);window.scrollTo(0,0);break;
    case 'review':{stopSpeech();const i=+d.i;if(S.rv&&S.rv.i===i){S.rv=null;renderResult();break}const q=Q.qs[i];S.rv={i,steps:Q.fails[i]||q.steps,shown:1};renderResult();scrollTafel();autoSpeak('review');break}
    case 'tNext':{const sc=SC[d.scope];stopSpeech();sc.set(Math.min(sc.get()+1,sc.steps().length));sc.r();scrollTafel();autoSpeak(d.scope);break}
    case 'tPrev':{const sc=SC[d.scope];stopSpeech();sc.set(Math.max(1,sc.get()-1));sc.r();scrollTafel();autoSpeak(d.scope);break}
    case 'tSay':{const sc=SC[d.scope];speakStep(sc.steps()[sc.get()-1]);break}
    case 'tPlay':{const sc=SC[d.scope];if(PLAY===d.scope){stopSpeech();sc.r();break}stopSpeech();PLAY=d.scope;if(sc.get()>=sc.steps().length)sc.set(1);sc.r();scrollTafel();autoSpeak(d.scope);break}
    case 'tVoice':{const sc=SC[d.scope];store.explainVoice=store.explainVoice===false;save();stopSpeech();sc.r();if(store.explainVoice)speakStep(sc.steps()[sc.get()-1]);break}
    case 'tray':if(Q.state!=='ask'&&Q.state!=='retry')return;Q.tray.push(+d.v);Q.tray.sort((a,b)=>b-a);Q.state='ask';renderQuiz();break;
    case 'untray':Q.tray.splice(+d.i,1);Q.state='ask';renderQuiz();break;
    case 'trayClear':Q.tray=[];Q.state='ask';renderQuiz();break;
    case 'checkBuild':if(!Q.tray.length)return;check(Q.tray.reduce((a,b)=>a+b,0));break;
    case 'key':if(Q.state!=='ask'&&Q.state!=='retry')return;if(d.k===','){if(!(cur().money||cur().dec)||Q.input.includes(','))return;Q.input=(Q.input||'0')+',';if(Q.state==='retry')Q.state='ask';renderQuiz();break}if(Q.input.includes(',')&&d.k!=='del'&&Q.input.split(',')[1].length>=2)return;if(d.k==='del')Q.input=Q.input.slice(0,-1);else if(Q.input.length<7)Q.input=(Q.input==='0'?'':Q.input)+d.k;if(Q.state==='retry')Q.state='ask';renderQuiz();break;
    case 'check':if(!Q.input)return;check(Q.input);break;
    case 'opt':check(cur().options[+d.i]);break;
    case 'help':Q.help++;renderQuiz();{const h=app.querySelector('.hint');h&&h.scrollIntoView({block:'nearest'});const hl=helpList(cur());if(voiceOn())speakStep(hl[Q.help-1])}break;
    case 'giveup':{const q=cur();Q.state='explain';Q.shown=1;Q.res.push(false);addWrong(q);renderQuiz();scrollTafel();autoSpeak('quiz');break}
    case 'why':Q.showSteps=true;Q.shown=1;renderQuiz();scrollTafel();autoSpeak('quiz');break;
    case 'next':stopSpeech();Q.i++;if(Q.i>=Q.n){finishRound()}else{startQ();window.scrollTo(0,0)}break;
    case 'atlas':S.atlasBack=S.screen==='topics'?'topics':'home';S.screen='atlas';S.atlas=S.atlas||{view:'de',sel:null};render();break;
    case 'atlasView':S.atlas={view:d.v,sel:null};renderAtlas();break;
    case 'atlasSel':S.atlas.sel=+d.i;renderAtlas();{const n=app.querySelector('.ainfo h3');n&&say(n.textContent.replace(/^[^A-Za-zÄÖÜäöü]+/,'').trim(),'de-DE')}break;
    case 'atlasSay':{const n=app.querySelector('.ainfo h3');n&&say(n.textContent.replace(/^[^A-Za-zÄÖÜäöü]+/,'').trim(),'de-DE');break}
    case 'soundToggle':store.sound=store.sound===false;save();renderHome();if(store.sound)tone('ok');break;
    case 'voiceExplainToggle':store.explainVoice=store.explainVoice===false;save();renderHome();if(store.explainVoice)say('Ich erkläre dir alles mit meiner Stimme.','de-DE');break;
    case 'helper':S.screen='helper';S.h={a:'',b:'',op:'+',res:null,shown:1};render();break;
    case 'hop':S.h.op=d.op;S.h.res=null;stopSpeech();renderHelper();break;
    case 'hsolve':helperSolve();break;
    case 'hnew':stopSpeech();S.h={a:'',b:'',op:S.h.op,res:null,shown:1};renderHelper();window.scrollTo(0,0);{const i=document.getElementById('ha');i&&i.focus()}break;
    case 'read':{const q=cur();say(mathSpeak(q.speak||plain(q.text+(q.sub?' '+q.sub:''))),q.speakLang||'de-DE');break}
    case 'sayEn':say(cur().say,'en-GB',.85);break;
    case 'saySlow':say(cur().say,'en-GB',.55);break;
    case 'spokeYes':check(true);break;
    case 'spokeNo':check(false);break;
    case 'sayWordSlow':{const q=cur();say(q.say,'de-DE',.55);break}
    case 'voiceSel':{store.voice=store.voice||{};store.voice[d.lang]=d.value;save();say(d.lang==='de'?'Hallo! So klinge ich beim Vorlesen.':'Hello! This is how I sound.',d.lang==='de'?'de-DE':'en-GB');break}
    case 'voiceTest':say(d.lang==='de'?'Hallo! So klinge ich beim Vorlesen.':'Hello! This is how I sound.',d.lang==='de'?'de-DE':'en-GB');break;
    case 'sayWord':{const q=cur();say(q.say,'de-DE',q.sentence?.75:.8);const i=document.getElementById('dikt');if(i&&matchMedia('(pointer:fine)').matches)i.focus();break}
    case 'peeked':Q.peeked=true;renderQuiz();{const i=document.getElementById('dikt');i&&i.focus()}break;
    case 'checkText':{const i=document.getElementById('dikt');const v=i?i.value:Q.input;if(!v.trim())return;Q.input=v;check(v);if(Q.state==='retry'){const j=document.getElementById('dikt');j&&j.focus()}break}
  }
}
app.addEventListener('change',e=>{if(e.target.tagName==='SELECT'&&e.target.dataset.lang)act('voiceSel',{lang:e.target.dataset.lang,value:e.target.value})});
app.addEventListener('input',e=>{if(e.target.id==='dikt'&&Q)Q.input=e.target.value;if(S.h&&(e.target.id==='ha'||e.target.id==='hb'))S.h[e.target.id==='ha'?'a':'b']=e.target.value});
app.addEventListener('keydown',e=>{if(e.target.id==='dikt'&&e.key==='Enter'){e.preventDefault();act('checkText',{})}if((e.target.id==='ha'||e.target.id==='hb')&&e.key==='Enter'){e.preventDefault();helperSolve()}});
app.addEventListener('click',e=>{const m=e.target.closest('[data-map]');if(m&&S.screen==='atlas'){act('atlasSel',{i:m.getAttribute('data-i')});return}const b=e.target.closest('[data-act]');if(!b||b.disabled)return;act(b.dataset.act,b.dataset)});
document.addEventListener('keydown',e=>{
  if(S.screen!=='quiz'||!Q||e.target.tagName==='INPUT')return;const q=cur();
  if(q.kind==='num'&&(Q.state==='ask'||Q.state==='retry')){if(/^[0-9]$/.test(e.key))act('key',{k:e.key});else if(e.key===','||e.key==='.')act('key',{k:','});else if(e.key==='Backspace')act('key',{k:'del'});else if(e.key==='Enter')act('check',{})}
  else if(e.key==='Enter'&&(Q.state==='ok'||Q.state==='tw'||(Q.state==='explain'&&Q.shown>=(Q.steps||q.steps).length)))act('next',{});
  else if(e.key==='Enter'&&Q.state==='explain')act('tNext',{scope:'quiz'});
});
render();
</script>
